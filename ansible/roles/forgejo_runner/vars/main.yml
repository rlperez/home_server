---
forgejo_runner_config:
  datacenters:
    - homelab

  namespace: "services"
  name: "home-server-1"

  image: "data.forgejo.org/forgejo/runner:13"
  instance: "https://git.home.arpa"
  nomad_job_path: "/etc/nomad.d/jobs/forgejo-runner.nomad"
  data_dir: "/opt/forgejo-runner"
  config_path: "/opt/forgejo-runner/config.yml"

  uid: 1000
  gid: 1000

  podman_socket: "/run/user/1000/podman/podman.sock"

  resources:
    cpu: 1000
    memory: 2048

  labels:
    - "bun:docker://oven/bun:1"
    - "clojure:docker://clojure:temurin-25-tools-deps-trixie"
    - "docker:docker://debian:trixie"
    - "elixir:docker://elixir:1.20-otp-29"
    - "node:docker://node:24-trixie"
    - "nix:docker://nixos/nix:latest"
