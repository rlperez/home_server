---
- name: Create postgres storage directory
  ansible.builtin.file:
    path: "{{ postgres_config.data_dir }}/data/18/docker"
    state: directory
    owner: "{{ postgres_config.uid }}"
    group: "{{ postgres_config.gid }}"
    mode: "0750"

- name: Ensure {{ postgres_config.nomad_namespace }} namespace exists
  environment:
    NOMAD_ADDR: "{{ nomad_server.nomad.addr }}"
    NOMAD_SKIP_VERIFY: "true"
    NOMAD_CACERT: "{{ nomad_server.nomad.vault.ca_file }}"
    NOMAD_CLIENT_CERT: "{{ nomad_server.nomad.vault.cert_file }}"
    NOMAD_CLIENT_KEY: "{{ nomad_server.nomad.vault.key_file }}"
    NOMAD_TOKEN: "{{ secrets.nomad.token }}"
  ansible.builtin.command:
    cmd: >
      nomad namespace apply {{ postgres_config.nomad_namespace }}
  register: nomad_namespace_apply
  changed_when: >
    "Successfully applied namespace" in nomad_namespace_apply.stdout

- name: Render Postgres Nomad job
  ansible.builtin.template:
    src: postgres.nomad.j2
    dest: "{{ postgres_config.nomad_job_path }}"
    mode: "0644"

- name: Run Postgres Nomad job
  environment:
    NOMAD_ADDR: "{{ nomad_server.nomad.addr }}"
    NOMAD_SKIP_VERIFY: "true"
    NOMAD_CACERT: "{{ nomad_server.nomad.vault.ca_file }}"
    NOMAD_CLIENT_CERT: "{{ nomad_server.nomad.vault.cert_file }}"
    NOMAD_CLIENT_KEY: "{{ nomad_server.nomad.vault.key_file }}"
    NOMAD_TOKEN: "{{ secrets.nomad.token }}"
  ansible.builtin.command:
    cmd: nomad job run {{ postgres_config.nomad_job_path }}
  register: nomad_postgres_run
  changed_when: "'Job registered' in nomad_postgres_run.stdout or 'Evaluation' in nomad_postgres_run.stdout"

- name: Wait for Postgres service to be healthy in Consul
  ansible.builtin.uri:
    url: "http://127.0.0.1:8500/v1/health/service/postgres?passing=true"
    method: GET
  register: consul_postgres_health
  retries: 30
  delay: 5
  until: consul_postgres_health.json | length > 0

- name: Check if firewalld is running
  ansible.builtin.command: firewall-cmd --state
  register: firewalld_state
  changed_when: false
  failed_when: false

- name: Open Postgres port in firewalld
  ansible.posix.firewalld:
    service: postgresql
    permanent: true
    state: enabled
    immediate: true
  when: firewalld_state.stdout == "running"
